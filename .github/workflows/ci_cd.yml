name: NIFTY50 Model CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality:
    name: Lint & Code Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run Flake8 Code Inspection
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=mlruns,__pycache__,.pytest_cache
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=mlruns,__pycache__,.pytest_cache

  unit-and-api-testing:
    name: Model & API Test Suite
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Execute Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v --tb=short

  dvc-data-verification:
    name: Data & Model Version Check
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Model Loading Libraries
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn joblib

      - name: Verify Model Artifact Availability
        run: |
          python -c "import os, joblib; assert os.path.exists('best_model.pkl'), 'Missing model'; m = joblib.load('best_model.pkl'); print('Model verified successfully:', type(m).__name__)"

  docker-build:
    name: Container Build & Health Validation
    runs-on: ubuntu-latest
    needs: [unit-and-api-testing, dvc-data-verification]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: nifty50-predictor:ci-${{ github.sha }}

      - name: Run Container Smoke Test
        run: |
          docker run -d --name test-container -p 8000:8000 nifty50-predictor:ci-${{ github.sha }}
          sleep 5
          docker ps
          docker logs test-container
