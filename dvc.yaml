stages:
  validate_data:
    cmd: python -c "import pandas as pd; df = pd.read_csv('final_nifty50_dataset.csv'); print('Rows:', len(df))"
    deps:
      - final_nifty50_dataset.csv
  validate_model:
    cmd: python -c "import joblib; m = joblib.load('best_model.pkl'); print('Model verified')"
    deps:
      - best_model.pkl
